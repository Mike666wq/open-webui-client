<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>Open WebUI Client</title>
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <img class="mark" src="/app-icon.png" alt="" aria-hidden="true" />
      <p class="eyebrow">OPEN WEBUI CLIENT</p>
      <h1 id="heading">Connect to your server</h1>
      <p id="detail" class="detail">Enter the address of your Open WebUI server.</p>
      <form id="connect-form">
        <label for="service-address">Server address</label>
        <input id="service-address" name="service-address" type="url" inputmode="url" autocomplete="url" spellcheck="false" required />
        <button id="connect" type="submit">Connect</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="export-diagnostics" class="secondary" type="button" hidden>Export Android diagnostics (not sent automatically)</button>
      <p id="diagnostics-status" class="detail" role="status" hidden></p>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
