name: Android APK release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-release-main
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.94.0
  NODE_VERSION: 22.22.0
  RELEASE_TARGETS: android
  ANDROID_VERSION_CODE_BASE: 100000

jobs:
  prepare-lockfile:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.lock.outputs.source_sha }}
      release: ${{ steps.selection.outputs.release }}
      reason: ${{ steps.selection.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require checked-in lockfiles and pin source
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select latest relevant main source before expensive work
        id: selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changes.json
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          before = os.environ.get('RELEASE_BEFORE_SHA', '')
          files = ['.github/workflows/android.yml']
          if before and set(before) != {'0'}:
              data = subprocess.check_output(['git', 'diff', '--name-only', '-z', before, os.environ['GITHUB_SHA']])
              files = [p.decode() for p in data.split(b'\0') if p]
          with open(os.environ['RELEASE_CHANGED_FILES'], 'w') as f:
              json.dump(files, f)
          PYCODE
          node scripts/release-orchestrator.mjs plan


  quality:
    needs: prepare-lockfile
    if: ${{ needs.prepare-lockfile.outputs.reason == 'documentation-only' }}
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ needs.prepare-lockfile.outputs.source_sha }}

  release-quality:
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.ready == 'true' }}
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.commit_sha }}

  validate-android-signing:
    needs: prepare-lockfile
    if: ${{ needs.prepare-lockfile.outputs.release == 'true' }}
    runs-on: ubuntu-22.04
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate the existing Android signing identity
        id: validate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-android-keystore.mjs
          echo 'validated=true' >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: [prepare-lockfile, validate-android-signing]
    if: ${{ needs.prepare-lockfile.outputs.release == 'true' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      tag: ${{ steps.prepare.outputs.tag }}
      version_code: ${{ steps.prepare.outputs.version_code }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bump and pin the release source on main
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_SECRETS_VALIDATED: ${{ needs.validate-android-signing.outputs.validated }}
        run: node scripts/release-orchestrator.mjs prepare

  release-emulator-smoke:
    needs: [prepare-release, release-quality]
    if: ${{ needs.prepare-release.outputs.ready == 'true' }}
    uses: ./.github/workflows/android-emulator-diagnose.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.commit_sha }}
      source_label: release-pinned

  android:
    needs: [prepare-release, release-quality, validate-android-signing]
    if: ${{ needs.prepare-release.outputs.ready == 'true' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_COMMIT_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
      ANDROID_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
      ANDROID_RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
    outputs:
      artifact_id: ${{ steps.upload-release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: android-arm64
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          chmod 700 "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/android-signing/release.p12"
          test -s "$RUNNER_TEMP/android-signing/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.p12" >> "$GITHUB_ENV"
      - name: Prepare Android manifest and release signing
        run: node scripts/prepare-android.mjs
      - name: Build signed ARM64 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openwebui-client
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npm run tauri -- android build --apk --target aarch64
      - name: Stage signed APK for internal inspection
        id: release-apk-staged
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          test "${#files[@]}" -eq 1 || { echo "Expected one ARM64 release APK, found ${#files[@]}" >&2; exit 1; }
          mkdir -p artifacts
          artifact="Open-WebUI-Client-${version}-android-arm64-vc${ANDROID_VERSION_CODE}.apk"
          cp "${files[0]}" "artifacts/${artifact}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Run Android connection-controls unit tests
        id: android-plugin-tests
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openwebui-client
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(./gradlew projects --console=plain)"
          printf '%s\n' "$projects"
          mapfile -t plugin_projects < <(printf '%s\n' "$projects" | sed -nE "s/.*Project '(:[^']*connection[-_]controls[^']*)'.*/\1/p" | sort -u)
          if [ "${#plugin_projects[@]}" -ne 1 ]; then
            echo "Expected one generated Gradle project for connection-controls; matching paths were: ${plugin_projects[*]:-(none)}" >&2
            exit 1
          fi
          ./gradlew "${plugin_projects[0]}:testDebugUnitTest" --console=plain
      - name: Verify signature and Android package metadata
        id: verify-release-apk
        if: always() && steps.release-apk-staged.outcome == 'success'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          test "${#files[@]}" -eq 1 || { echo "Expected one ARM64 release APK, found ${#files[@]}" >&2; exit 1; }
          node scripts/verify-android-apk.mjs "${files[0]}" "$ANDROID_VERSION_CODE"
          git diff --exit-code -- src-tauri/Cargo.lock
      - name: Report Android release package validation
        if: always() && steps.release-apk-staged.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.verify-release-apk.outcome }}" = "success" ]; then
            echo "The signed APK passed package verification. It remains internal until all release gates succeed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The signed APK was retained as an internal UNVERIFIED artifact because Android unit or package validation failed or did not complete. It cannot enter a Release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record android package provenance
        if: steps.release-apk-staged.outcome == 'success' && steps.android-plugin-tests.outcome == 'success' && steps.verify-release-apk.outcome == 'success'
        run: node scripts/artifact-integrity.mjs stage android artifacts
      - uses: actions/upload-artifact@v4
        id: upload-release
        if: steps.release-apk-staged.outcome == 'success' && steps.android-plugin-tests.outcome == 'success' && steps.verify-release-apk.outcome == 'success'
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-android-arm64-vc${{ needs.prepare-release.outputs.version_code }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          retention-days: 14
          path: |
            artifacts/Open-WebUI-Client-*-android-arm64-vc*.apk
            artifacts/android.manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.release-apk-staged.outcome == 'success' && (steps.android-plugin-tests.outcome != 'success' || steps.verify-release-apk.outcome != 'success')
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-android-arm64-UNVERIFIED-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/Open-WebUI-Client-*-android-arm64-vc*.apk
          retention-days: 14
          if-no-files-found: error

  publish-release:
    needs: [prepare-release, release-quality, android, release-emulator-smoke]
    if: ${{ always() && needs.prepare-release.outputs.ready == 'true' && needs.prepare-release.result == 'success' && needs.release-quality.result == 'success' && needs.android.result == 'success' && needs.release-emulator-smoke.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          merge-multiple: true
          path: release-inputs
      - name: Publish verified Android APK and checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
          RELEASE_RUN_ID: ${{ needs.prepare-release.outputs.run_id }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
          RELEASE_ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_ARTIFACT_DIR: release-inputs
        run: node scripts/release-orchestrator.mjs publish

  timing-summary:
    needs: [prepare-lockfile, quality, validate-android-signing, prepare-release, release-quality, android, release-emulator-smoke, publish-release]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - name: Summarize release phases and outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PYCODE'
          import datetime, json, os
          jobs = json.load(open(os.environ['RUNNER_TEMP']+'/jobs.json'))['jobs']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Phase | Result | Seconds |\n|---|---|---:|\n')
              for job in jobs:
                  start, end = job.get('started_at'), job.get('completed_at')
                  if start and end:
                      seconds = int((datetime.datetime.fromisoformat(end.replace('Z','+00:00'))-datetime.datetime.fromisoformat(start.replace('Z','+00:00'))).total_seconds())
                      out.write(f"| {job['name']} | {job['conclusion']} | {seconds} |\n")
          PYCODE
