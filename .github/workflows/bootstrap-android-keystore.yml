name: Initialize Android release keystore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-keystore-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  initialize-keystore:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify main-only one-time bootstrap
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Keystore initialization is allowed only from main." >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Set the high-entropy ANDROID_KEYSTORE_PASSWORD repository secret before running this workflow." >&2
            exit 1
          fi
          if [ "${#ANDROID_KEYSTORE_PASSWORD}" -lt 32 ]; then
            echo "ANDROID_KEYSTORE_PASSWORD must contain at least 32 characters; use a password manager to generate it." >&2
            exit 1
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 already exists; refusing to replace or regenerate the signing key." >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Do not rerun keystore generation: create a new workflow run after reviewing the previous run's artifact status." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate password-protected PKCS#12 key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/android-keystore"
          node scripts/generate-android-keystore.mjs "$output_dir"
          fingerprint="$(sed -n 's/^SHA-256 certificate fingerprint: //p' "$output_dir/keystore-fingerprint.txt")"
          {
            echo "## Android signing keystore initialized"
            echo "The password-protected PKCS#12 artifact is available for one day. The artifact is not private: download and back it up privately, then delete the artifact and this workflow run."
            echo
            echo "SHA-256 certificate fingerprint: `$fingerprint`"
            echo "Alias: `openwebui-client`"
            echo "Do not post the password or keystore contents in chat or commit them to the repository."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-keystore/openwebui-client.p12
            ${{ runner.temp }}/android-keystore/keystore-fingerprint.txt
          retention-days: 1
          if-no-files-found: error
