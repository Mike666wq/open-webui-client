name: Android emulator startup diagnosis

on:
  workflow_dispatch:
    inputs:
      source:
        description: App source to diagnose
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - current
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source SHA for the Android emulator smoke test
        required: true
        type: string
      source_label:
        description: Human-readable source label for evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-emulator-diagnose-${{ github.run_id }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  RUST_VERSION: 1.94.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_SMOKE_BASELINE_SHA: 3edd2b1191f5f7bbd56cf2d35dd401bb61489f10

jobs:
  choose-source:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_kind: ${{ steps.source.outputs.source_kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select pinned baseline or current app source
        id: source
        env:
          ANDROID_SMOKE_REQUESTED_SOURCE: ${{ inputs.source || 'baseline' }}
          ANDROID_SMOKE_PINNED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          ANDROID_SMOKE_SOURCE_LABEL: ${{ inputs.source_label || '' }}
          ANDROID_SMOKE_BEFORE: ${{ github.event.before }}
          ANDROID_SMOKE_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          changed_json='[]'
          if [ -z "$ANDROID_SMOKE_PINNED_SOURCE_SHA" ] && [ -z "$ANDROID_SMOKE_SOURCE_LABEL" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -z "$ANDROID_SMOKE_BEFORE" ] || [[ "$ANDROID_SMOKE_BEFORE" =~ ^0+$ ]]; then
              echo "Push event has no usable before SHA; refusing to guess the app source." >&2
              exit 1
            fi
            changed_json="$(git diff --name-only "$ANDROID_SMOKE_BEFORE" "$ANDROID_SMOKE_SHA" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(s.split(/\r?\n/).filter(Boolean))))')"
          fi
          ANDROID_SMOKE_CHANGED_PATHS="$changed_json" node scripts/select-android-smoke-source.mjs >> "$GITHUB_OUTPUT"

  build-x86_64-test-apk:
    needs: choose-source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload-apk.outputs.artifact-id }}
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.signing.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.choose-source.outputs.source_sha }}
          path: app-source
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-source/src-tauri -> target
          cache-on-failure: true
          key: android-x86_64
      - name: Install locked frontend dependencies
        working-directory: app-source
        run: npm ci
      - name: Fetch locked Rust dependencies
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Initialize Android project
        working-directory: app-source
        run: npm run tauri -- android init --ci
      - name: Create runner-local throwaway release keystore
        id: signing
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/android-emulator-diagnostic.p12"
          password="$(openssl rand -hex 32)"
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          if [ "$version_code" -gt 2100000000 ]; then
            echo "Diagnostic versionCode exceeds Android's supported maximum." >&2
            exit 1
          fi
          echo "::add-mask::$password"
          export ANDROID_SMOKE_KEY_PASSWORD="$password"
          keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
            -alias openwebui-client -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=Temporary Android Emulator Diagnostic" \
            -storepass:env ANDROID_SMOKE_KEY_PASSWORD -keypass:env ANDROID_SMOKE_KEY_PASSWORD >/dev/null 2>&1
          test -s "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=openwebui-client"
            echo "ANDROID_KEY_PASSWORD=$password"
            echo "ANDROID_RELEASE_VERSION_CODE=$version_code"
            echo "ANDROID_SMOKE_VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Prepare and build release-profile x86_64 diagnostic APK
        id: android-apk-build
        working-directory: app-source
        run: |
          node scripts/prepare-android.mjs
          npm run tauri -- android build --apk --target x86_64
      - name: Preserve bundled local interface for CI inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-local-interface-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: app-source/dist/
          retention-days: 14
          if-no-files-found: ignore
      - name: Run Android connection-controls unit tests
        working-directory: app-source/src-tauri/gen/android
        shell: bash
        run: |
          set -euo pipefail
          projects="$(./gradlew projects --console=plain)"
          printf '%s\n' "$projects"
          mapfile -t plugin_projects < <(printf '%s\n' "$projects" | sed -nE "s/.*Project '(:[^']*connection[-_]controls[^']*)'.*/\1/p" | sort -u)
          if [ "${#plugin_projects[@]}" -ne 1 ]; then
            echo "Expected one generated Gradle project for connection-controls; matching paths were: ${plugin_projects[*]:-(none)}" >&2
            exit 1
          fi
          ./gradlew "${plugin_projects[0]}:testDebugUnitTest" --console=plain
      - name: Verify and collect only the diagnostic APK
        if: always() && steps.android-apk-build.outcome == 'success'
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*release*')
          test "${#apks[@]}" -eq 1 || { echo "Expected one release APK, found ${#apks[@]}" >&2; exit 1; }
          apk="${apks[0]}"
          apkanalyzer manifest application-id "$apk" | grep -Fx 'local.openwebui.client'
          apkanalyzer manifest version-code "$apk" | grep -Fx "$ANDROID_SMOKE_VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          unzip -l "$apk" | grep -q 'lib/x86_64/'
          mkdir -p "$RUNNER_TEMP/android-diagnostic-apk"
          cp "$apk" "$RUNNER_TEMP/android-diagnostic-apk/diagnostic-x86_64.apk"
          {
            echo "## Android emulator diagnostic build"
            echo "- App source: ${{ needs.choose-source.outputs.source_kind }} (${{ needs.choose-source.outputs.source_sha }})"
            echo "- Version code: $ANDROID_SMOKE_VERSION_CODE"
            echo "- Package: local.openwebui.client"
            echo "- Signing key: temporary, generated for this runner job and not retained"
            echo "- APK: test-only artifact; not a release asset"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify compiled official icon resources on the selected current source
        if: ${{ needs.choose-source.outputs.source_kind != 'v0.2.2-baseline' }}
        working-directory: app-source
        shell: bash
        run: |
          node scripts/verify-android-apk.mjs "$RUNNER_TEMP/android-diagnostic-apk/diagnostic-x86_64.apk" --icons-only
      - name: Record diagnostic APK provenance
        id: metadata
        working-directory: app-source
        env:
          RELEASE_COMMIT_SHA: ${{ needs.choose-source.outputs.source_sha }}
          RELEASE_VERSION_CODE: ${{ steps.signing.outputs.version_code }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          export RELEASE_VERSION="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node ../scripts/artifact-integrity.mjs stage diagnostic "$RUNNER_TEMP/android-diagnostic-apk"
      - uses: actions/upload-artifact@v4
        id: upload-apk
        with:
          name: android-emulator-diagnostic-apk-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-diagnostic-apk/
          retention-days: 14
          if-no-files-found: error

  emulator-smoke:
    needs: [choose-source, build-x86_64-test-apk]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Add Android emulator binary to PATH
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/emulator/emulator"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install screenshot text recognition for DocumentsUI geometry fallback
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr imagemagick
      - name: Install x86_64 Google APIs image
        run: sdkmanager "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-x86_64-test-apk.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/android-diagnostic-apk
      - name: Enable KVM access on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Create and boot API ${{ matrix.api }} x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 420))
          emulator_pid=''
          boot_success=0
          evidence="$RUNNER_TEMP/android-emulator-evidence"
          mkdir -p "$evidence"
          capture_boot_failure() {
            if [ -f "$RUNNER_TEMP/emulator.log" ]; then
              tail -300 "$RUNNER_TEMP/emulator.log" > "$evidence/emulator-startup.log" || true
            fi
            timeout 10s avdmanager list avd > "$evidence/avd-list.txt" 2>&1 || true
            timeout 10s adb devices -l > "$evidence/adb-devices.txt" 2>&1 || true
            timeout 10s adb logcat -b crash -d -t 500 > "$evidence/emulator-crash-logcat.txt" 2>&1 || true
            echo "Boot diagnostics saved to the always-uploaded evidence artifact." >&2
          }
          stop_emulator() {
            if [ -n "$emulator_pid" ] && kill -0 "$emulator_pid" 2>/dev/null; then
              kill -TERM "$emulator_pid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$emulator_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$emulator_pid" 2>/dev/null; then
                kill -KILL "$emulator_pid" 2>/dev/null || true
              fi
              wait "$emulator_pid" 2>/dev/null || true
            fi
          }
          on_exit() {
            local status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$boot_success" -ne 1 ]; then
              capture_boot_failure
              stop_emulator
            fi
            exit "$status"
          }
          trap on_exit EXIT

          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          printf 'no\n' | timeout --signal=TERM --kill-after=5s 120s avdmanager create avd --force \
            --name "diagnose-api-${{ matrix.api }}" \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_2
          avd_name="diagnose-api-${{ matrix.api }}"
          test -s "$ANDROID_AVD_HOME/$avd_name.ini"
          test -d "$ANDROID_AVD_HOME/$avd_name.avd"
          timeout 10s avdmanager list avd > "$evidence/avd-list.txt"
          grep -F "Name: $avd_name" "$evidence/avd-list.txt"
          timeout --signal=TERM --kill-after=5s 30s emulator -accel-check
          nohup emulator -avd "$avd_name" -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/emulator.pid"
          timeout 10s adb start-server

          device_ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(timeout 10s adb get-state 2>/dev/null | tr -d '\r' || true)" = "device" ]; then
              device_ready=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator process exited before ADB connected." >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$device_ready" -ne 1 ]; then
            echo "Emulator did not connect to ADB within the 420-second startup deadline." >&2
            exit 1
          fi

          boot_completed=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
              boot_completed=1
              break
            fi
            sleep 5
          done
          if [ "$boot_completed" -ne 1 ]; then
            echo "ADB connected, but Android did not complete boot within the 420-second startup deadline." >&2
            exit 1
          fi

          timeout 15s adb shell settings put global window_animation_scale 0
          timeout 15s adb shell settings put global transition_animation_scale 0
          timeout 15s adb shell settings put global animator_duration_scale 0
          boot_success=1
          echo "Android emulator connected and booted successfully before the 420-second deadline."
      - name: Verify and install the diagnostic APK
        env:
          RELEASE_COMMIT_SHA: ${{ needs.choose-source.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.build-x86_64-test-apk.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.build-x86_64-test-apk.outputs.version_code }}
        run: |
          node scripts/artifact-integrity.mjs verify diagnostic "$RUNNER_TEMP/android-diagnostic-apk"
          adb install "$RUNNER_TEMP/android-diagnostic-apk/diagnostic-x86_64.apk"
      - name: Verify Android native chrome and real connection interactions
        if: ${{ needs.choose-source.outputs.source_kind != 'v0.2.2-baseline' }}
        shell: bash
        run: |
          python scripts/android-native-experience.py --output "$RUNNER_TEMP/android-emulator-evidence/native-ui"
      - name: Run cold-start, idle and lifecycle checks
        shell: bash
        env:
          ANDROID_SMOKE_SOURCE_SHA: ${{ needs.choose-source.outputs.source_sha }}
          ANDROID_SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          python scripts/android-emulator-smoke.py \
            --output "$RUNNER_TEMP/android-emulator-evidence" \
            --api "$ANDROID_SMOKE_API" \
            --source-sha "$ANDROID_SMOKE_SOURCE_SHA"
          {
            echo "## Android emulator runtime result"
            echo "- App source: ${{ needs.choose-source.outputs.source_kind }} ($ANDROID_SMOKE_SOURCE_SHA)"
            echo "- API level: $ANDROID_SMOKE_API"
            echo "- The script records the idle baseline and supplementary interaction result separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload filtered diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence-api-${{ matrix.api }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-emulator-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          set +e
          pid_file="$RUNNER_TEMP/emulator.pid"
          if [ -s "$pid_file" ]; then
            emulator_pid="$(cat "$pid_file")"
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill -TERM "$emulator_pid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$emulator_pid" 2>/dev/null || exit 0
                sleep 1
              done
              kill -KILL "$emulator_pid" 2>/dev/null || true
            fi
          fi
