name: Build desktop and Android packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build an installable signed Android candidate, or publish a three-platform release
        required: true
        type: choice
        default: candidate
        options:
          - candidate
          - release
      skip_emulator:
        description: Skip emulator checks for investigation only; this run cannot publish a Release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.94.0
  NODE_VERSION: 22.22.0

jobs:
  prepare-lockfile:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.lock.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require checked-in lockfiles and pin source
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare-lockfile
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Check synchronized app version
        run: npm run version:check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Smoke-test protected Android keystore generation
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          export ANDROID_KEYSTORE_BASE64=''
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/keystore-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          node scripts/generate-android-keystore.mjs "$smoke_dir"
          test -s "$smoke_dir/openwebui-client.p12"
          test -s "$smoke_dir/keystore-fingerprint.txt"
          export ANDROID_KEYSTORE_BASE64="$(base64 -w 0 "$smoke_dir/openwebui-client.p12")"
          node scripts/validate-android-keystore.mjs
          echo "Temporary Android keystore generation, alias and password validation passed."
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/plugins/connection-controls/Cargo.toml -- --check

  cleanup-merged-stage-branches:
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Delete only the four merged stage branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          branches=(
            codex/stage-1
            codex/stage-2-connection-settings
            codex/stage-3-downloads
            codex/stage-4-signing-delivery
          )
          for branch in "${branches[@]}"; do
            ref="refs/heads/$branch"
            live_sha="$(git ls-remote origin "$ref" | cut -f1)"
            if [ -z "$live_sha" ]; then
              echo "$branch is already absent; treating it as cleaned."
              continue
            fi
            git fetch --no-tags origin "$ref:refs/remotes/origin/$branch"
            fetched_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            if [ "$fetched_sha" != "$live_sha" ]; then
              echo "$branch changed while checking; refusing branch deletion." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$live_sha" "$GITHUB_SHA"; then
              echo "$branch is not merged into the pinned main SHA; refusing branch deletion." >&2
              exit 1
            fi
            current_sha="$(git ls-remote origin "$ref" | cut -f1)"
            if [ "$current_sha" != "$live_sha" ]; then
              echo "$branch changed after ancestry validation; refusing branch deletion." >&2
              exit 1
            fi
            current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "$current_main_sha" != "$GITHUB_SHA" ]; then
              echo "main moved during cleanup; refusing further branch deletions." >&2
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged stage branch $branch at $live_sha."
          done

  validate-android-signing:
    needs: prepare-lockfile
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate the existing Android signing identity
        id: validate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-android-keystore.mjs
          echo 'validated=true' >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: [prepare-lockfile, validate-android-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      tag: ${{ steps.prepare.outputs.tag }}
      version_code: ${{ steps.prepare.outputs.version_code }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bump and pin the release source on main
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_SECRETS_VALIDATED: ${{ needs.validate-android-signing.outputs.validated }}
        run: node scripts/release-orchestrator.mjs prepare

  release-quality:
    needs: prepare-release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Check synchronized app version
        run: npm run version:check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Smoke-test protected Android keystore generation
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          export ANDROID_KEYSTORE_BASE64=''
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/keystore-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          node scripts/generate-android-keystore.mjs "$smoke_dir"
          test -s "$smoke_dir/openwebui-client.p12"
          test -s "$smoke_dir/keystore-fingerprint.txt"
          export ANDROID_KEYSTORE_BASE64="$(base64 -w 0 "$smoke_dir/openwebui-client.p12")"
          node scripts/validate-android-keystore.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/plugins/connection-controls/Cargo.toml -- --check

  candidate-quality:
    needs: [prepare-lockfile, validate-android-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'candidate' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Check synchronized app version
        run: npm run version:check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/plugins/connection-controls/Cargo.toml -- --check

  release-emulator-smoke:
    needs: [prepare-release, release-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' && inputs.skip_emulator != true }}
    uses: ./.github/workflows/android-emulator-diagnose.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.commit_sha }}
      source_label: release-pinned

  candidate-emulator-smoke:
    needs: [prepare-lockfile, candidate-quality, validate-android-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'candidate' && needs.validate-android-signing.outputs.validated == 'true' }}
    uses: ./.github/workflows/android-emulator-diagnose.yml
    with:
      source_sha: ${{ needs.prepare-lockfile.outputs.source_sha }}
      source_label: candidate

  windows:
    needs: [prepare-release, release-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Stage NSIS installer before icon validation
        id: windows-installer-staged
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version"
          $files = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $artifact = "Open-WebUI-Client-$version-windows-x64-setup.exe"
          Copy-Item $files[0].FullName "artifacts/$artifact"
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
      - name: Verify Windows executable icons
        id: verify-windows-icons
        shell: pwsh
        run: |
          git diff --exit-code -- src-tauri/Cargo.lock
          $files = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          $icoPath = 'src-tauri/icons/icon.ico'
          $icoBytes = [IO.File]::ReadAllBytes((Resolve-Path $icoPath))
          $entryCount = [BitConverter]::ToUInt16($icoBytes, 4)
          $iconSizes = @()
          for ($i = 0; $i -lt $entryCount; $i++) {
            $offset = 6 + ($i * 16)
            $width = if ($icoBytes[$offset] -eq 0) { 256 } else { [int]$icoBytes[$offset] }
            $height = if ($icoBytes[$offset + 1] -eq 0) { 256 } else { [int]$icoBytes[$offset + 1] }
            if ($width -eq $height) { $iconSizes += $width }
          }
          foreach ($size in @(16, 32, 48, 256)) {
            if ($iconSizes -notcontains $size) { throw "Official ICO is missing a ${size}px frame" }
          }
          Add-Type -AssemblyName System.Drawing
          function Assert-EmbeddedIconMatches([string]$exePath, [string]$expectedIco) {
            $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exePath))
            if ($null -eq $actualIcon) { throw "No embedded Windows icon resource in $exePath" }
            $resolvedExpectedIcon = Resolve-Path -LiteralPath $expectedIco
            $expectedIcon = [System.Drawing.Icon]::new($resolvedExpectedIcon.Path, $actualIcon.Size)
            $actualBitmap = $actualIcon.ToBitmap()
            $expectedBitmap = $expectedIcon.ToBitmap()
            try {
              if ($actualBitmap.Size -ne $expectedBitmap.Size) { throw "Embedded icon size differs in $exePath" }
              for ($y = 0; $y -lt $actualBitmap.Height; $y++) {
                for ($x = 0; $x -lt $actualBitmap.Width; $x++) {
                  if ($actualBitmap.GetPixel($x, $y).ToArgb() -ne $expectedBitmap.GetPixel($x, $y).ToArgb()) {
                    throw "Embedded icon pixels do not match the official ICO in $exePath"
                  }
                }
              }
            } finally {
              $actualBitmap.Dispose(); $expectedBitmap.Dispose(); $actualIcon.Dispose(); $expectedIcon.Dispose()
            }
          }
          Assert-EmbeddedIconMatches 'src-tauri/target/release/open-webui-client.exe' $icoPath
          Assert-EmbeddedIconMatches $files[0].FullName $icoPath
          Write-Host 'Desktop application and NSIS installer icons match the official ICO.'
      - name: Report Windows package validation
        if: always() && steps.windows-installer-staged.outcome == 'success'
        shell: pwsh
        run: |
          if ('${{ steps.verify-windows-icons.outcome }}' -eq 'success') {
            Add-Content $env:GITHUB_STEP_SUMMARY 'The NSIS installer passed icon validation; it remains internal until every release gate succeeds.'
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'The installer is retained as an internal UNVERIFIED artifact after post-build validation failed. It cannot enter a Release.'
          }
      - uses: actions/upload-artifact@v4
        if: steps.windows-installer-staged.outcome == 'success' && steps.verify-windows-icons.outcome == 'success'
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-windows-x64
          path: artifacts/Open-WebUI-Client-*-windows-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.windows-installer-staged.outcome == 'success' && steps.verify-windows-icons.outcome != 'success'
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-windows-x64-UNVERIFIED-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/Open-WebUI-Client-*-windows-x64-setup.exe
          retention-days: 3
          if-no-files-found: error

  macos:
    needs: [prepare-release, release-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Build ad-hoc DMG
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles dmg
      - name: Stage DMG before post-build checks
        id: macos-dmg-staged
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1 || { echo "Expected one DMG, found ${#files[@]}" >&2; exit 1; }
          mkdir -p artifacts
          cp "${files[0]}" "artifacts/Open-WebUI-Client-${version}-macos-${{ matrix.arch }}.dmg"
      - name: Run Rust library unit tests
        id: rust-library-tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked --target aarch64-apple-darwin
      - name: Verify packaged DMG icon
        id: verify-macos-icon
        shell: bash
        run: |
          git diff --exit-code -- src-tauri/Cargo.lock
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1 || { echo "Expected one DMG, found ${#files[@]}" >&2; exit 1; }
          mountpoint="$RUNNER_TEMP/app-icon-check"
          mkdir -p "$mountpoint"
          dmg="${files[0]}"
          cleanup_mount() {
            hdiutil detach "$mountpoint" -quiet -force 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint" >/dev/null
          app_count="$(find "$mountpoint" -maxdepth 2 -type d -name '*.app' | wc -l | tr -d '[:space:]')"
          test "$app_count" -eq 1 || { echo "Expected one app bundle in DMG, found $app_count" >&2; exit 1; }
          app="$(find "$mountpoint" -maxdepth 2 -type d -name '*.app' -print -quit)"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          icon_name="$(basename "$icon_name")"
          [[ "$icon_name" == *.icns ]] || icon_name="${icon_name}.icns"
          packaged_icon="$app/Contents/Resources/$icon_name"
          test -s "$packaged_icon"
          dimensions="$(sips -g pixelWidth -g pixelHeight "$packaged_icon" | awk '/pixelWidth/{w=$2}/pixelHeight/{h=$2}END{if(w>0&&h>0)print "ok"}')"
          test "$dimensions" = ok
          cmp "$packaged_icon" src-tauri/icons/icon.icns
          echo 'Mounted DMG app icon matches the official ICNS byte-for-byte.'
      - name: Report macOS package validation
        if: always() && steps.macos-dmg-staged.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.rust-library-tests.outcome }}" = "success" ] && [ "${{ steps.verify-macos-icon.outcome }}" = "success" ]; then
            echo 'The DMG passed Rust tests and packaged-icon validation; it remains internal until every release gate succeeds.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The DMG is retained as an internal UNVERIFIED artifact after a post-build check failed. It cannot enter a Release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.macos-dmg-staged.outcome == 'success' && steps.rust-library-tests.outcome == 'success' && steps.verify-macos-icon.outcome == 'success'
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-macos-${{ matrix.arch }}
          path: artifacts/Open-WebUI-Client-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.macos-dmg-staged.outcome == 'success' && (steps.rust-library-tests.outcome != 'success' || steps.verify-macos-icon.outcome != 'success')
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-macos-${{ matrix.arch }}-UNVERIFIED-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/Open-WebUI-Client-*-macos-${{ matrix.arch }}.dmg
          retention-days: 3
          if-no-files-found: error

  android:
    needs: [prepare-release, release-quality, validate-android-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    env:
      ANDROID_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
      ANDROID_RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          chmod 700 "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/android-signing/release.p12"
          test -s "$RUNNER_TEMP/android-signing/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.p12" >> "$GITHUB_ENV"
      - name: Prepare Android manifest and release signing
        run: node scripts/prepare-android.mjs
      - name: Build signed ARM64 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openwebui-client
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npm run tauri -- android build --apk --target aarch64
      - name: Stage signed APK for internal inspection
        id: release-apk-staged
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          test "${#files[@]}" -eq 1 || { echo "Expected one ARM64 release APK, found ${#files[@]}" >&2; exit 1; }
          mkdir -p artifacts
          artifact="Open-WebUI-Client-${version}-android-arm64-vc${ANDROID_VERSION_CODE}.apk"
          cp "${files[0]}" "artifacts/${artifact}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Run Android connection-controls unit tests
        id: android-plugin-tests
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openwebui-client
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_VERSION_CODE: ${{ needs.prepare-release.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(./gradlew projects --console=plain)"
          printf '%s\n' "$projects"
          mapfile -t plugin_projects < <(printf '%s\n' "$projects" | sed -nE "s/.*Project '(:[^']*connection[-_]controls[^']*)'.*/\1/p" | sort -u)
          if [ "${#plugin_projects[@]}" -ne 1 ]; then
            echo "Expected one generated Gradle project for connection-controls; matching paths were: ${plugin_projects[*]:-(none)}" >&2
            exit 1
          fi
          ./gradlew "${plugin_projects[0]}:testDebugUnitTest" --console=plain
      - name: Verify signature and Android package metadata
        id: verify-release-apk
        if: always() && steps.release-apk-staged.outcome == 'success'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          test "${#files[@]}" -eq 1 || { echo "Expected one ARM64 release APK, found ${#files[@]}" >&2; exit 1; }
          node scripts/verify-android-apk.mjs "${files[0]}" "$ANDROID_VERSION_CODE"
          git diff --exit-code -- src-tauri/Cargo.lock
      - name: Report Android release package validation
        if: always() && steps.release-apk-staged.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.verify-release-apk.outcome }}" = "success" ]; then
            echo "The signed APK passed package verification. It remains internal until all release gates succeed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The signed APK was retained as an internal UNVERIFIED artifact because Android unit or package validation failed or did not complete. It cannot enter a Release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.release-apk-staged.outcome == 'success' && steps.android-plugin-tests.outcome == 'success' && steps.verify-release-apk.outcome == 'success'
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-android-arm64-vc${{ needs.prepare-release.outputs.version_code }}
          path: artifacts/Open-WebUI-Client-*-android-arm64-vc*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.release-apk-staged.outcome == 'success' && (steps.android-plugin-tests.outcome != 'success' || steps.verify-release-apk.outcome != 'success')
        with:
          name: Open-WebUI-Client-${{ needs.prepare-release.outputs.version }}-android-arm64-UNVERIFIED-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/Open-WebUI-Client-*-android-arm64-vc*.apk
          retention-days: 3
          if-no-files-found: error

  android-candidate:
    needs: [prepare-lockfile, validate-android-signing, candidate-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'candidate' && needs.validate-android-signing.outputs.validated == 'true' }}
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        id: android-version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          if [ "$version_code" -gt 2100000000 ]; then
            echo "Candidate versionCode exceeds Android's supported maximum." >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
