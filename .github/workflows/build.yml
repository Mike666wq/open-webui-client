          {
            echo "## Signed Android candidate staged"
            echo "- App version: ${version} (source unchanged; no version bump, tag or Release)"
            echo "- Android versionCode: ${ANDROID_VERSION_CODE} (1000 + workflow run number)"
            echo "- Artifact: ${artifact} (UNVERIFIED test candidate)"
            echo "- Source: ${{ needs.prepare-lockfile.outputs.source_sha }}"
            echo "- Package checks and API 29/36 emulator smoke are separate gates; see their steps and evidence artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run Android connection-controls unit tests
        id: android-plugin-tests
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openwebui-client
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(./gradlew projects --console=plain)"
          printf '%s\n' "$projects"
          mapfile -t plugin_projects < <(printf '%s\n' "$projects" | sed -nE "s/.*Project '(:[^']*connection[-_]controls[^']*)'.*/\1/p" | sort -u)
          if [ "${#plugin_projects[@]}" -ne 1 ]; then
            echo "Expected one generated Gradle project for connection-controls; matching paths were: ${plugin_projects[*]:-(none)}" >&2
            exit 1
          fi
          ./gradlew "${plugin_projects[0]}:testDebugUnitTest" --console=plain
      - name: Verify signature, official icons and Android metadata
        id: verify-candidate-apk
        if: always() && steps.candidate-metadata.outcome == 'success'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*release*')
          test "${#apks[@]}" -eq 1 || { echo "Expected one ARM64 candidate APK, found ${#apks[@]}" >&2; exit 1; }
          node scripts/verify-android-apk.mjs "${apks[0]}" "$ANDROID_VERSION_CODE"
          git diff --exit-code -- src-tauri/Cargo.lock
      - name: Report candidate package validation
        if: always() && steps.candidate-metadata.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.android-plugin-tests.outcome }}" = "success" ] && [ "${{ steps.verify-candidate-apk.outcome }}" = "success" ]; then
            sed -i '1c\CANDIDATE PACKAGE CHECKS PASSED' artifacts/README.txt
            echo "The candidate passed Android unit, signature, metadata and icon checks. Physical-device acceptance remains pending; emulator status is separate." >> "$GITHUB_STEP_SUMMARY"
          else
            sed -i '1c\UNVERIFIED CANDIDATE — DO NOT INSTALL' artifacts/README.txt
            echo "The built APK is retained as an internal UNVERIFIED artifact because Android unit or package validation failed or did not complete. Do not install or distribute it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate-metadata.outcome == 'success'
        with:
          name: Open-WebUI-Client-candidate-${{ steps.candidate-metadata.outputs.version }}-android-arm64-vc${{ steps.android-version.outputs.version_code }}-run${{ github.run_id }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-signing/release.p12"

