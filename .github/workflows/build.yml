name: Build desktop and Android packages

on:
  push:
    branches:
      - 'codex/stage-*'
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: Which platforms to build
        type: choice
        required: true
        default: desktop
        options:
          - desktop
          - android
          - all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.94.0
  NODE_VERSION: 22.22.0

jobs:
  prepare-lockfile:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.lock.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Verify or create Cargo.lock
        id: lock
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -f package-lock.json ] && [ -f src-tauri/Cargo.lock ]; then
              echo "Both lockfiles exist; this PR will use the checked-in lockfiles."
              echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "A required lockfile is missing. Push the branch to run lockfile bootstrap, then include package-lock.json and src-tauri/Cargo.lock in the pull request." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Cargo.lock is missing and lockfile bootstrap requires a branch ref." >&2
            exit 1
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          else
            cargo update --workspace --manifest-path src-tauri/Cargo.toml
          fi
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json src-tauri/Cargo.lock
          git commit -m "chore: bootstrap dependency lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare-lockfile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/plugins/connection-controls/Cargo.toml -- --check

  windows:
    needs: prepare-lockfile
    if: ${{ inputs.targets != 'android' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version"
          git diff --exit-code -- src-tauri/Cargo.lock
          $files = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $files[0].FullName "artifacts/Open-WebUI-Client-$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Open-WebUI-Client-windows-x64
          path: artifacts/Open-WebUI-Client-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    needs: prepare-lockfile
    if: ${{ inputs.targets != 'android' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Build ad-hoc DMG
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles dmg
      - name: Run Rust library unit tests
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked --target aarch64-apple-darwin
      - name: Collect DMG
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          git diff --exit-code -- src-tauri/Cargo.lock
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1 || { echo "Expected one DMG, found ${#files[@]}" >&2; exit 1; }
          mkdir -p artifacts
          cp "${files[0]}" "artifacts/Open-WebUI-Client-${version}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Open-WebUI-Client-macos-${{ matrix.arch }}
          path: artifacts/Open-WebUI-Client-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  android-check:
    needs: prepare-lockfile
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Prepare Android manifest and release signing
        run: node scripts/prepare-android.mjs
      - name: Compile Android debug APK for CI checks
        run: npm run tauri -- android build --debug --apk --target aarch64
      - name: Verify Cargo lockfile stayed unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock

  android:
    needs: prepare-lockfile
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.targets == 'android' || inputs.targets == 'all') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-lockfile.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Require Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Required Android signing secret is missing: ${name}" >&2; exit 1; fi
          done
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Prepare Android manifest and release signing
        run: node scripts/prepare-android.mjs
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          test -s "$RUNNER_TEMP/android-signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed ARM64 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --apk --target aarch64
      - name: Collect APK
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          git diff --exit-code -- src-tauri/Cargo.lock
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          test "${#files[@]}" -eq 1 || { echo "Expected one ARM64 release APK, found ${#files[@]}" >&2; printf '%s\n' "${files[@]}"; exit 1; }
          mkdir -p artifacts
          cp "${files[0]}" "artifacts/Open-WebUI-Client-${version}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Open-WebUI-Client-android-arm64
          path: artifacts/Open-WebUI-Client-*-android-arm64.apk
          if-no-files-found: error
