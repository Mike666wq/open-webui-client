name: Android layout and bundled frontend diagnosis

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch, tag or full commit SHA
        required: false
        default: codex/mist-glass-ui
      frontend_commit:
        description: Optional full SHA that frontend_ref must resolve to
        required: false
        default: ''
  push:
    branches:
      - codex/android-layout-fix
      - codex/android-wallpaper-diagnose
      - codex/android-wallpaper-preview-fix
      - codex/android-glass-new-chat
      - codex/android-glass-controls
    paths:
      - .github/workflows/android-wallpaper-diagnose.yml
      - scripts/android-bundled-frontend-diagnose.py
      - scripts/create-runner-frontend-lock.mjs
      - scripts/create-runner-frontend-lock.test.mjs
      - scripts/android-bundled-frontend-diagnose.test.mjs
      - scripts/frontend-api-fixture.test.mjs
      - scripts/android-wallpaper-diagnose-workflow.test.mjs
      - scripts/fixtures/personalization/**
      - frontend.lock.json
      - package.json
      - package-lock.json
      - src-tauri/gen/android/**
      - src-tauri/src/connection.rs
      - src-tauri/plugins/connection-controls/android/**

permissions:
  contents: read

concurrency:
  group: android-wallpaper-diagnose-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22.22.0
  RUST_VERSION: 1.94.0
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      frontend_commit: ${{ steps.frontend.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: android-wallpaper-x86_64
      - name: Install frontend dependencies
        run: npm ci
      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Materialize the exact frontend candidate
        id: frontend
        shell: bash
        env:
          FRONTEND_REPOSITORY: Mike666wq/open-webui-frontend
          FRONTEND_REF: ${{ inputs.frontend_ref || 'codex/mist-glass-ui' }}
          EXPECTED_FRONTEND_COMMIT: ${{ inputs.frontend_commit || '' }}
        run: |
          set -euo pipefail
          frontend="$RUNNER_TEMP/open-webui-frontend"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${FRONTEND_REPOSITORY}.git" "$frontend"
          git -C "$frontend" fetch --depth=1 origin "$FRONTEND_REF"
          commit="$(git -C "$frontend" rev-parse FETCH_HEAD)"
          test "${#commit}" -eq 40
          if [ -n "$EXPECTED_FRONTEND_COMMIT" ] && [ "$commit" != "$EXPECTED_FRONTEND_COMMIT" ]; then
            echo "Requested frontend SHA does not match the fetched ref." >&2
            exit 1
          fi
          git -C "$frontend" checkout --detach "$commit"
          echo "FRONTEND_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "frontend_root=$frontend" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_ROOT=$frontend" >> "$GITHUB_ENV"
          npm ci --prefix "$frontend" --no-audit --no-fund
          npm --prefix "$frontend" run test:frontend -- --run
          npm --prefix "$frontend" run build
          npm --prefix "$frontend" run frontend:bundle
          node scripts/create-runner-frontend-lock.mjs \
            --frontend-root "$FRONTEND_ROOT" \
            --source-commit "$FRONTEND_COMMIT" \
            --output frontend.lock.json
      - name: Install and verify the candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import { prepareBundledFrontend } from "./scripts/prepare-bundled-frontend.mjs";
            const result = await prepareBundledFrontend({ archivePath: `${process.env.FRONTEND_ROOT}/dist/open-webui-frontend.zip` });
            const expected = process.env.FRONTEND_COMMIT;
            if (result.sourceCommit !== expected) throw new Error("Prepared bundle SHA mismatch");
          '
      - name: Run Android native policy and bundle unit tests
        shell: bash
        run: |
          set -euo pipefail
          projects="$(src-tauri/gen/android/gradlew -p src-tauri/gen/android projects --console=plain)"
          printf '%s\n' "$projects"
          mapfile -t plugin_projects < <(
            printf '%s\n' "$projects" |
              sed -nE "s/.*Project '(:[^']*connection[-_]controls[^']*)'.*/\1/p" |
              sort -u
          )
          test "${#plugin_projects[@]}" -eq 1
          src-tauri/gen/android/gradlew -p src-tauri/gen/android \
            "${plugin_projects[0]}:testDebugUnitTest" --console=plain
      - name: Build x86_64 debug diagnostic APK
        run: |
          node scripts/prepare-android.mjs
          npm run tauri -- android build --debug --apk --target x86_64
      - name: Verify diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*debug*'
          )
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "${apks[0]}"
          unzip -l "${apks[0]}" | grep -q 'lib/x86_64/'
          mkdir -p "$RUNNER_TEMP/android-wallpaper-apk"
          cp "${apks[0]}" "$RUNNER_TEMP/android-wallpaper-apk/wallpaper-diagnostic.apk"
          sha256sum "$RUNNER_TEMP/android-wallpaper-apk/wallpaper-diagnostic.apk" \
            > "$RUNNER_TEMP/android-wallpaper-apk/SHA256SUMS"
          bundle="src-tauri/plugins/connection-controls/android/src/main/assets/bundled-frontend"
          python3 scripts/bundled-frontend-archive.py apk \
            "${apks[0]}" frontend.lock.json > "$RUNNER_TEMP/android-wallpaper-apk/bundled-frontend-verification.json"
          cp -R "$bundle" "$RUNNER_TEMP/android-wallpaper-apk/bundled-frontend"
          cp frontend.lock.json "$RUNNER_TEMP/android-wallpaper-apk/frontend.lock.json"
          printf '%s\n' "$FRONTEND_COMMIT" > "$RUNNER_TEMP/android-wallpaper-apk/frontend-commit.txt"
          sha256sum "$RUNNER_TEMP/android-wallpaper-apk/bundled-frontend/frontend-manifest.json" \
            > "$RUNNER_TEMP/android-wallpaper-apk/frontend-manifest.sha256"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: android-wallpaper-diagnostic-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-wallpaper-apk/
          retention-days: 7
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Install emulator and screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sdkmanager \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/android-wallpaper-apk
      - name: Install browser inspection dependencies
        run: |
          python3 -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
      - name: Boot API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/android-wallpaper-evidence"
          mkdir -p "$evidence"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | avdmanager create avd --force \
            --name wallpaper-api-36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2
          nohup emulator -avd wallpaper-api-36 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            > "$RUNNER_TEMP/wallpaper-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wallpaper-emulator.pid"
          adb start-server
          deadline=$((SECONDS + 420))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              tail -300 "$RUNNER_TEMP/wallpaper-emulator.log" > "$evidence/startup.log"
              exit 1
            fi
            sleep 5
          done
          shell_settings=(
            "settings put global window_animation_scale 0"
            "settings put global transition_animation_scale 0"
            "settings put global animator_duration_scale 0"
          )
          for setting in "${shell_settings[@]}"; do adb shell "$setting"; done
      - name: Install and verify diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/android-wallpaper-apk"
          sha256sum --check SHA256SUMS
          sha256sum --check frontend-manifest.sha256
          test "$(cat frontend-commit.txt)" = "${{ needs.build.outputs.frontend_commit }}"
          python3 "$GITHUB_WORKSPACE/scripts/bundled-frontend-archive.py" verify \
            bundled-frontend frontend.lock.json > bundled-frontend-verification.json
          adb install -r wallpaper-diagnostic.apk
      - name: Start API-only fixture for the real bundled frontend
        shell: bash
        env:
          FRONTEND_COMMIT: ${{ needs.build.outputs.frontend_commit }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/android-wallpaper-apk/bundled-frontend"
          test -s "$bundle/frontend-manifest.json"
          node --input-type=module --eval '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/android-wallpaper-apk/bundled-frontend/frontend-manifest.json"));
            if(p.sourceCommit!==process.env.FRONTEND_COMMIT) throw new Error("Artifact frontend commit does not match");
          '
          node scripts/fixtures/personalization/frontend-api-server.mjs "$bundle" \
            > "$RUNNER_TEMP/frontend-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend-fixture.pid"
          fixture_ready=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/__fixture_provenance > "$RUNNER_TEMP/frontend-provenance.json"; then
              fixture_ready=1
              break
            fi
            sleep 1
          done
          test "$fixture_ready" -eq 1
          node --input-type=module --eval '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/frontend-provenance.json"));
            if(p.sourceCommit!==process.env.FRONTEND_COMMIT) throw new Error("Unserved frontend commit does not match");
          '
      - name: Run Android layout and bundled frontend diagnosis
        shell: bash
        env:
          FRONTEND_COMMIT: ${{ needs.build.outputs.frontend_commit }}
        run: |
          set +e
          python scripts/android-bundled-frontend-diagnose.py \
            --output "$RUNNER_TEMP/android-wallpaper-evidence" \
            --source-sha "$GITHUB_SHA" \
            --frontend-sha "$FRONTEND_COMMIT" \
            --fixture-provenance "$RUNNER_TEMP/frontend-provenance.json" 2>&1 | tee "$RUNNER_TEMP/android-wallpaper-evidence.log"
          status=${PIPESTATUS[0]}
          {
            echo "## Android layout and bundled frontend diagnosis"
            echo
            if [ "$status" -eq 0 ]; then
              echo "**PASS** — the real bundled frontend passed the connection, viewport, and settings layout checks."
            else
              echo "**FAIL** — see the sanitized failure below."
              echo
              echo '```text'
              grep -E 'ANDROID_BUNDLED_FRONTEND_DIAGNOSE_(PASS|FAILED):|DiagnosisFailure:|AssertionError:|Error:|Traceback' \
                "$RUNNER_TEMP/android-wallpaper-evidence.log" | tail -20 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            failure="$(grep -E 'ANDROID_BUNDLED_FRONTEND_DIAGNOSE_FAILED:' "$RUNNER_TEMP/android-wallpaper-evidence.log" | tail -1 || true)"
            failure="${failure//'%'/'%25'}"
            failure="${failure//$'\r'/'%0D'}"
            failure="${failure//$'\n'/'%0A'}"
            echo "::error title=Android layout diagnosis failure::${failure:-See uploaded evidence}"
          fi
          exit "$status"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wallpaper-evidence-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-wallpaper-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s "$RUNNER_TEMP/frontend-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/frontend-fixture.pid")" 2>/dev/null
          fi
          if [ -s "$RUNNER_TEMP/wallpaper-emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/wallpaper-emulator.pid")" 2>/dev/null
          fi
