name: Pull request quick checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ github.sha }}
